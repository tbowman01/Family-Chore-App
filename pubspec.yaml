name: family_chores_app
description: A cross-platform family chores app with login, rewards, and photo proof.
version: 0.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4

  # State Management
  provider: ^6.1.2

  # Media & Files
  image_picker: ^1.1.2

  # Notifications
  flutter_local_notifications: ^17.2.3

  # Utilities
  intl: ^0.19.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/mockups/